listen: :12000

#使用CA证书
acme:
  domains:
    - "ccc.ccc.ccc"
  email: ccc@ccc.ccc
  type: dns
  dns:
    name: cloudflare
    config:
      cloudflare_api_token: ccccccccccccccccccccccccccccccc

#tls:
#  cert: /etc/hysteria/hy2cert.pem
#  key: /etc/hysteria/hy2key.pem


auth:
  type: password
  password: ccccccccccccccccc

#obfs:
#  type: salamander 
#  salamander:
#    password: cqmyg@dtsgx

ech:
  keyPath: /etc/hysteria/ech.pem

quic:
  initStreamReceiveWindow: 8388608 
  maxStreamReceiveWindow: 8388608 
  initConnReceiveWindow: 20971520 
  maxConnReceiveWindow: 20971520 
  maxIdleTimeout: 30s 
  maxIncomingStreams: 1024 
  disablePathMTUDiscovery: false
    
congestion:
  type: bbr
  bbrProfile: standard

masquerade:
  type: proxy
  proxy:
    url: https://bing.com
    rewriteHost: true
  # ... (上述其他字段)
  listenHTTP: :80 
  listenHTTPS: :443 
  forceHTTPS: true

outbounds:
  - name: v6_only
    type: direct
    direct:
      mode: 64
      bindIPv6: cccc:cccc:cccc:cccc
      fastOpen: false
          
acl:
  inline:
    - v6_only(all)
    - reject(geoip:cn)
    - direct(all)
